# One-screen demo of the Gapiring package: speak a line, and measure load time, first audio, real-time factor and
# memory. Generate the Xcode project with `xcodegen` in this folder (GapiringDemo.xcodeproj is checked in as well).
name: GapiringDemo
options:
  bundleIdPrefix: uz.gapi
  deploymentTarget:
    iOS: "15.1"
packages:
  Gapiring:
    path: ../..
targets:
  GapiringDemo:
    type: application
    platform: iOS
    sources: [GapiringDemo]
    dependencies:
      - package: Gapiring
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.gapi.gapiring.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gapiring
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.7"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
